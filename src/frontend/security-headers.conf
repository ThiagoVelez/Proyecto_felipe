# Cabeceras de seguridad comunes (DEF-35). Se incluyen en cada "location" porque en nginx un add_header dentro de
# un bloque anula los heredados del nivel server: antes los JS y CSS se servian sin ninguna de estas cabeceras.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# X-XSS-Protection esta obsoleta y desactivada en los navegadores actuales; la proteccion la da la CSP
add_header X-XSS-Protection "0" always;
# Camara para el lector PDF417 de farmacia y ubicacion para la sede mas cercana del portal del paciente
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
# CSP: solo recursos propios, fuentes de Google Fonts y videos de YouTube embebidos en el muro de salud.
# style-src necesita 'unsafe-inline' por los atributos style de React; los scripts no admiten codigo en linea.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
# HSTS: los navegadores solo la aplican por HTTPS. En produccion el TLS se termina delante de este contenedor
# (balanceador o proxy con certificado); por HTTP plano la cabecera se ignora sin efectos.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
