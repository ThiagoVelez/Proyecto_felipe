services:
  # =============================================================================
  # 1. BASE DE DATOS RELACIONAL: MySQL 8.0 (Cumplimiento ISO/IEC 25010)
  # =============================================================================
  database:
    image: mysql:8.0
    container_name: saludconecta-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password_segura
      MYSQL_DATABASE: saludconecta_db
      MYSQL_USER: saludconecta_user
      MYSQL_PASSWORD: saludconecta_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_password_segura || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - saludconecta-net

  # =============================================================================
  # 2. BACKEND API: Go 1.22+ & GoFiber v2 (Arquitectura Hexagonal)
  # =============================================================================
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: saludconecta-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 8080
      APP_ENV: production
      APP_NAME: SaludConectaIPS
      DB_DRIVER: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: saludconecta_user
      DB_PASSWORD: saludconecta_pass
      DB_NAME: saludconecta_db
      JWT_SECRET: clave_secreta_jwt_saludconecta_ips_v24_iso25010_2026
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80,http://localhost,http://127.0.0.1:5173
      ADMIN_INITIAL_EMAIL: admin@saludconecta.ips.gov.co
      ADMIN_INITIAL_PASSWORD: Admin2026*Secure!
      IPS_NIT: "900123456"
      COD_PRESTADOR: "110010999901"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - saludconecta-net

  # =============================================================================
  # 3. FRONTEND PWA: React + Vite + Nginx Alpine (Proxy Inverso y SPA Routing)
  # =============================================================================
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: saludconecta-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - saludconecta-net

volumes:
  mysql_data:
    name: saludconecta_mysql_data

networks:
  saludconecta-net:
    name: saludconecta_network
    driver: bridge

